CONFIG_BOOT_SIGNATURE_TYPE_NONE=y
CONFIG_BOOT_BOOTSTRAP=n
CONFIG_MCUBOOT_LOG_LEVEL_OFF=y
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n
CONFIG_FLASH_PAGE_LAYOUT=y

# A sleepy end device boots through this loader on every wake: do not hash the whole slot at each start. A new image
# is still checked before it is swapped in. (The upgrade mode, swap using offset, is the one sysbuild picks; the
# application requests a test upgrade and confirms it.)
CONFIG_BOOT_VALIDATE_SLOT0=n
