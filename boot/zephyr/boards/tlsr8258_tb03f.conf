CONFIG_BOOT_SIGNATURE_TYPE_NONE=y
CONFIG_BOOT_UPGRADE_ONLY=y
# The image check costs 18 us per byte on this core; check a new image once.
CONFIG_BOOT_VALIDATE_SLOT0=n
CONFIG_BOOT_VALIDATE_SLOT0_ONCE=y
CONFIG_BOOT_BOOTSTRAP=n

CONFIG_MCUBOOT_SERIAL=y
CONFIG_BOOT_SERIAL_UART=y
CONFIG_BOOT_SERIAL_WAIT_FOR_DFU=y
# The loader listens by about 50 ms after the reset; a host that sends at once needs no more.
CONFIG_BOOT_SERIAL_WAIT_FOR_DFU_TIMEOUT=200
# The image check takes about 18 us per byte on this core (2.6 s for 140 KB): listen first.
CONFIG_BOOT_SERIAL_WAIT_FOR_DFU_FIRST=y
CONFIG_BOOT_SERIAL_NO_APPLICATION=y

CONFIG_FLASH_PAGE_LAYOUT=y

CONFIG_MCUBOOT_LOG_LEVEL_OFF=y
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n

CONFIG_PICOLIBC=n
CONFIG_MINIMAL_LIBC=y
CONFIG_MAIN_STACK_SIZE=4096

# The flash binding has no erase-block-size, so the sector count is not derived.
CONFIG_BOOT_MAX_IMG_SECTORS_AUTO=n
CONFIG_BOOT_MAX_IMG_SECTORS=64

# Receive the serial recovery stream through DMA: the interrupt-driven FIFO is too shallow.
CONFIG_UART_TLSR8258_IRQ_DMA_RX=y

# Pad the loader's SRAM head to 0x1700 bytes, the largest application head the 8 KB boot mirror
# allows next to the 0x900 bytes of instruction cache scratch (see BOOT_TC32_HEAD_PAD). Without it an
# application with a head over 0x900 bytes, a Zigbee router has 0x1100, does not start.
CONFIG_BOOT_TC32_HEAD_PAD=0xe00
